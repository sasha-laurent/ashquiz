<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ashquiz — racines grecques et latines</title>
    <meta
      name="description"
      content="Cinq racines par jour : retrouver le sens en français et l'origine, grecque ou latine."
    />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>"
    />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-name">Ashquiz</span>
        <span class="brand-theme">Racines</span>
      </div>
      <nav class="themes" aria-label="Thèmes">
        <a href="index.html">Accueil</a>
        <a href="departements.html">Départements</a>
        <a href="tableaux.html">Tableaux</a>
        <a href="pays.html">Pays</a>
        <a href="etats-unis.html">États-Unis</a>
        <a href="racines.html" aria-current="page">Racines</a>
        <a href="plantes.html">Plantes</a>
      </nav>
      <div class="topbar-meta">
        <span id="today-label" class="today"></span>
        <span id="streak" class="badge" hidden></span>
      </div>
    </header>

    <main>
      <section id="screen-quiz" class="screen" hidden>
        <div class="quiz-head">
          <ol id="progress" class="progress" aria-label="Progression"></ol>
          <span id="mode-badge" class="badge badge-practice" hidden>Entraînement</span>
        </div>

        <form id="answer-form" class="card" autocomplete="off">
          <p class="prompt">
            <span id="q-type" class="q-type">Préfixe</span>
            <strong id="q-root" class="q-code">—</strong>
          </p>

          <div class="fields root-fields">
            <label class="field">
              <span class="field-label">Sens en français</span>
              <input id="in-sens" type="text" spellcheck="false" enterkeyhint="done" />
            </label>

            <p class="field-label map-instruction" id="origins-label">Origine</p>
            <div id="origins" class="origins" role="radiogroup" aria-labelledby="origins-label">
              <button type="button" class="origin" data-origine="grec" role="radio" aria-checked="false">
                Grec
              </button>
              <button type="button" class="origin" data-origine="latin" role="radio" aria-checked="false">
                Latin
              </button>
            </div>
          </div>

          <p id="example" class="hint root-hint"></p>
          <p id="root-detail" class="root-detail muted"></p>

          <div id="feedback" class="feedback" hidden></div>

          <div class="actions">
            <button id="btn-validate" type="submit" class="btn btn-primary">Valider</button>
            <button id="btn-next" type="button" class="btn btn-primary" hidden>Suivant</button>
            <button
              id="btn-carre"
              type="button"
              class="btn"
              title="Quatre propositions pour le sens, pour cette question seulement"
            >
              Passer au carré
            </button>
            <button
              id="btn-exemple"
              type="button"
              class="btn"
              title="Un mot français bâti sur cette racine, pour cette question seulement"
            >
              Voir un exemple
            </button>
          </div>
        </form>
      </section>

      <section id="screen-summary" class="screen" hidden>
        <div class="card">
          <p id="summary-title" class="summary-title"></p>
          <p id="summary-score" class="summary-score"></p>
          <ul id="summary-list" class="summary-list"></ul>
          <div class="actions">
            <button id="btn-practice" type="button" class="btn">Entraînement libre</button>
            <a class="btn" href="index.html">Changer de thème</a>
          </div>
        </div>

        <div class="card stats">
          <h2>Progression</h2>
          <dl id="stats-list" class="stats-list"></dl>
          <button id="btn-reset" type="button" class="btn btn-quiet">Effacer ma progression</button>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>Racines, préfixes et suffixes du français savant — corpus équilibré entre grec et latin.</span>
    </footer>

    <script type="module" src="src/app-roots.js"></script>
  </body>
</html>
